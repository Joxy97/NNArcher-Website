[build]
  command = "npm run build && npm run check"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
  CONTACT_DELIVERY = "netlify"

# Netlify owns HTTPS and www/apex redirects through its primary-domain setting.
# Keep src/seo.mjs siteOrigin in sync with that setting (currently nnarcher.com).
# An opposite forced redirect here can create a domain redirect loop.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
